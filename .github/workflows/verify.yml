name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  code:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/test
      BETTER_AUTH_SECRET: ci-only-secret-with-more-than-32-characters
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx prisma validate
  database:
    needs: code
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.TEST_BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: http://localhost:3200
      DISABLE_AUTH_RATE_LIMIT: "1"
      CONFIRM_DISPOSABLE_TEST_DB: "1"
      STOCKWISE_TEST_DB_READY: ${{ vars.STOCKWISE_TEST_DB_READY }}
    steps:
      - name: Require isolated test branch configuration
        run: |
          if [ "$STOCKWISE_TEST_DB_READY" != "1" ] || [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ] || [ -z "$BETTER_AUTH_SECRET" ]; then
            echo "Configure the disposable Neon test branch secrets and STOCKWISE_TEST_DB_READY=1 before this gate can pass."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: API and browser integration
        run: |
          npx next start --port 3200 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..90}; do
            if curl --fail --silent http://localhost:3200/login > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3200/login > /dev/null
          node tests/api/roles-smoke.mjs http://localhost:3200
          node tests/api/sync-invariants.mjs http://localhost:3200
          npm run benchmark
          npm run test:e2e
        env:
          BENCHMARK_BASE_URL: http://localhost:3200
